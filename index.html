<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Feliz Día, Sofi 🫀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-white:#fbf3f4;
    --paper-blush:#f6cdd7;
    --paper-pink:#ef9fb4;
    --paper-pink-deep:#e07a97;
    --petal-gold:#ffd23f;
    --petal-amber:#ffb300;
    --petal-deep:#e88a00;
    --disc-dark:#241207;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow-x:hidden;
    background:#020305;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Poppins', sans-serif;
    position:relative;
    background:
      radial-gradient(ellipse 90% 60% at 50% 18%, #171a24 0%, #0a0b10 45%, #020305 75%),
      radial-gradient(ellipse 70% 50% at 50% 100%, #0d0a10 0%, #020305 60%);
  }

  /* ---------- ESTRELLAS ---------- */
  .stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
  }
  .star{
    position:absolute;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 0 6px 1px rgba(255,255,255,0.6);
    animation-name:twinkle;
    animation-iteration-count:infinite;
    animation-timing-function:ease-in-out;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.15); }
  }

  /* ---------- ESCENA ---------- */
  .scene{
    position:relative;
    z-index:2;
    width:min(400px, 92vw);
    display:none;
    flex-direction:column;
    align-items:center;
    padding:48px 0 40px;
    opacity:0;
  }
  .scene.scene-visible{
    display:flex;
    animation:sceneIn 1s ease-out forwards;
  }
  @keyframes sceneIn{
    from{ opacity:0; transform:translateY(14px) scale(0.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  /* ---------- PANTALLA DE REGALO ---------- */
  .gate{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .gate.gate-hide{
    opacity:0;
    transform:scale(0.94);
    pointer-events:none;
  }
  .gate-content{
    text-align:center;
    width:min(340px, 88vw);
    padding:38px 28px 34px;
    border-radius:28px;
    background:rgba(10,10,14,0.46);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:0 20px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.18);
  }
  .gift-box{
    font-size:64px;
    line-height:1;
    margin-bottom:18px;
    animation:giftWiggle 2.4s ease-in-out infinite;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,0.5));
  }
  @keyframes giftWiggle{
    0%,100%{ transform:rotate(-4deg) translateY(0); }
    50%{ transform:rotate(4deg) translateY(-6px); }
  }
  .gate-title{
    margin:0 0 6px;
    font-weight:400;
    font-size:17px;
    color:#ffffff;
    text-shadow:0 1px 10px rgba(255,255,255,0.2);
  }
  .gate-question{
    margin:0 0 26px;
    font-weight:300;
    font-size:15px;
    color:rgba(255,255,255,0.75);
    min-height:20px;
    transition:opacity 0.2s ease;
  }
  .gate-buttons{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    min-height:52px;
  }
  .btn-gate{
    font-family:'Poppins', sans-serif;
    font-weight:500;
    font-size:15px;
    border:none;
    border-radius:999px;
    padding:12px 26px;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn-yes{
    background:linear-gradient(135deg, #ffe600, #ffb300);
    color:#2a1a00;
    box-shadow:0 8px 18px rgba(255,200,0,0.35), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn-yes:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 12px 22px rgba(255,200,0,0.45), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .btn-no{
    background:rgba(255,255,255,0.12);
    color:rgba(255,255,255,0.85);
    border:1px solid rgba(255,255,255,0.25);
    position:relative;
  }

  /* ---------- FLOTACIÓN DEL RAMO ---------- */
  .bouquet-wrapper{
    position:relative;
    width:400px;
    height:400px;
    animation:floatBouquet 6.5s ease-in-out infinite;
    filter:drop-shadow(0 40px 45px rgba(0,0,0,0.65));
  }
  @keyframes floatBouquet{
    0%   { transform:translateY(0px) rotate(-1deg) scale(1); }
    50%  { transform:translateY(-14px) rotate(1deg) scale(1.01); }
    100% { transform:translateY(0px) rotate(-1deg) scale(1); }
  }

  /* ---------- SOMBRA DE SUELO ---------- */
  .ground-shadow{
    position:absolute;
    bottom:-6px;
    left:50%;
    width:280px;
    height:36px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 72%);
    transform:translateX(-50%);
    animation:shadowPulse 6.5s ease-in-out infinite;
    z-index:1;
  }
  @keyframes shadowPulse{
    0%,100%{ transform:translateX(-50%) scale(1); opacity:0.9; }
    50%{ transform:translateX(-50%) scale(0.85); opacity:0.6; }
  }

  /* ---------- ENVOLTORIO DE PAPEL (CONO) ---------- */
  .paper-wrap{
    position:absolute;
    left:50%;
    bottom:6px;
    width:400px;
    height:300px;
    transform:translateX(-50%);
    z-index:2;
  }
  .paper-layer{
    position:absolute;
    left:50%;
    bottom:0;
    transform-origin:bottom center;
  }

  .layer-1{
    width:370px;
    height:270px;
    transform:translateX(-50%) rotate(-12deg);
    background:linear-gradient(150deg, var(--paper-white) 0%, var(--paper-blush) 55%, var(--paper-pink) 100%);
    clip-path:polygon(
      50% 34%, 58% 40%, 66% 33%, 74% 42%, 83% 35%, 90% 46%,
      97% 40%, 100% 55%, 90% 62%, 78% 100%, 22% 100%, 10% 62%,
      0% 55%, 3% 40%, 10% 46%, 17% 35%, 26% 42%, 34% 33%, 42% 40%
    );
    box-shadow: inset 12px -18px 30px rgba(180,90,110,0.28),
                inset -10px 10px 20px rgba(255,255,255,0.5);
    filter:drop-shadow(6px 10px 14px rgba(50,10,25,0.35));
  }

  .layer-2{
    width:325px;
    height:250px;
    transform:translateX(-50%) rotate(10deg);
    background:linear-gradient(200deg, var(--paper-pink) 0%, var(--paper-pink-deep) 60%, var(--paper-blush) 100%);
    clip-path:polygon(
      50% 30%, 60% 38%, 70% 28%, 80% 40%, 90% 30%, 96% 44%,
      100% 58%, 86% 66%, 72% 100%, 28% 100%, 14% 66%,
      0% 58%, 4% 44%, 10% 30%, 20% 40%, 30% 28%, 40% 38%
    );
    opacity:0.92;
    box-shadow: inset 10px -14px 22px rgba(120,30,55,0.35),
                inset -8px 8px 18px rgba(255,255,255,0.35);
    filter:drop-shadow(4px 8px 10px rgba(40,5,20,0.3));
  }

  .layer-3{
    width:270px;
    height:215px;
    transform:translateX(-50%) rotate(-7deg);
    background:linear-gradient(160deg, #ffffff 0%, var(--paper-white) 45%, var(--paper-blush) 100%);
    clip-path:polygon(
      50% 26%, 62% 34%, 74% 24%, 86% 36%, 96% 28%, 100% 46%,
      88% 56%, 68% 100%, 32% 100%, 12% 56%,
      0% 46%, 4% 28%, 14% 36%, 26% 24%, 38% 34%
    );
    box-shadow: inset 8px -12px 18px rgba(200,140,155,0.3),
                inset -6px 6px 14px rgba(255,255,255,0.7);
    filter:drop-shadow(3px 6px 8px rgba(60,20,30,0.25));
  }

  .layer-4{
    width:210px;
    height:170px;
    transform:translateX(-50%) rotate(5deg);
    background:linear-gradient(180deg, #ffffff 0%, #fde3ea 100%);
    clip-path:polygon(
      50% 18%, 64% 28%, 78% 16%, 92% 30%, 100% 46%,
      84% 54%, 62% 100%, 38% 100%, 16% 54%,
      0% 46%, 8% 30%, 22% 16%, 36% 28%
    );
    opacity:0.95;
    box-shadow: inset 6px -10px 14px rgba(220,170,180,0.35);
  }

  /* ---------- LAZO / MOÑO ---------- */
  .ribbon{
    position:absolute;
    left:50%;
    bottom:132px;
    width:130px;
    height:74px;
    transform:translateX(-50%);
    z-index:5;
  }
  .ribbon-wing{
    position:absolute;
    top:8px;
    width:60px;
    height:46px;
    background:linear-gradient(135deg,#ff5b3d, #c81f3d 65%, #8f1330 100%);
    box-shadow:0 6px 10px rgba(0,0,0,0.4), inset 2px 2px 6px rgba(255,180,150,0.5);
  }
  .ribbon-wing.left{
    left:2px;
    clip-path:polygon(100% 50%, 0% 0%, 15% 50%, 0% 100%);
    transform:rotate(-6deg);
  }
  .ribbon-wing.right{
    right:2px;
    clip-path:polygon(0% 50%, 100% 0%, 85% 50%, 100% 100%);
    transform:rotate(6deg);
  }
  .ribbon-tail{
    position:absolute;
    top:40px;
    width:20px;
    height:34px;
    background:linear-gradient(160deg,#c81f3d,#7c0f28);
    box-shadow:0 4px 8px rgba(0,0,0,0.4);
  }
  .ribbon-tail.left{
    left:32px;
    clip-path:polygon(0 0, 100% 0, 65% 100%, 35% 85%);
    transform:rotate(-4deg);
  }
  .ribbon-tail.right{
    right:32px;
    clip-path:polygon(0 0, 100% 0, 65% 85%, 35% 100%);
    transform:rotate(4deg);
  }
  .ribbon-badge{
    position:absolute;
    left:50%;
    top:16px;
    width:44px;
    height:44px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd6a0, #ff8a3d 45%, #d1451f 78%, #8a2210 100%);
    box-shadow:
      0 0 20px 4px rgba(255,140,60,0.65),
      inset 0 2px 4px rgba(255,255,255,0.6),
      inset 0 -4px 8px rgba(90,20,5,0.5),
      0 6px 10px rgba(0,0,0,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .ribbon-badge::before{
    content:"✦";
    color:#fff6e5;
    font-size:19px;
    text-shadow:0 0 6px rgba(255,220,160,0.9);
  }

  /* ---------- CÚPULA DE FLORES ---------- */
  .dome{
    position:absolute;
    left:50%;
    bottom:128px;
    width:400px;
    height:185px;
    transform:translateX(-50%) rotate(-1.5deg);
    z-index:4;
  }
  .flower{
    position:absolute;
  }
  .petal{
    position:absolute;
    left:50%;
    top:50%;
    transform-origin:50% 100%;
    border-radius:50% 50% 46% 46% / 64% 64% 22% 22%;
  }
  .petal.inner{
    z-index:2;
  }
  .petal.outer{
    z-index:1;
  }
  .disc{
    position:absolute;
    left:50%;
    top:50%;
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:3;
  }

  /* ---------- TARJETA DEDICATORIA ---------- */
  .card{
    position:relative;
    z-index:3;
    margin-top:-14px;
    width:min(360px, 88vw);
    padding:26px 26px 28px;
    border-radius:28px;
    background:rgba(10,10,14,0.46);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter:blur(16px) saturate(140%);
    -webkit-backdrop-filter:blur(16px) saturate(140%);
    box-shadow:
      0 20px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 0 40px rgba(255,180,200,0.04);
    animation:cardIn 1.4s ease-out 0.3s both;
  }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .dedication{
    margin:0;
    text-align:center;
    font-weight:300;
    font-size:17px;
    line-height:1.65;
    letter-spacing:0.2px;
    color:#ffffff;
    text-shadow:0 1px 10px rgba(255,255,255,0.25), 0 1px 2px rgba(0,0,0,0.4);
  }

  @media (max-width:400px){
    .bouquet-wrapper{ transform-origin:top center; }
    .scene{ padding-top:36px; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <!-- ---------- PANTALLA DE REGALO (GATE) ---------- -->
  <div class="gate" id="gate">
    <div class="gate-content">
      <div class="gift-box" id="giftBox">🎁</div>
      <p class="gate-title">tengo un regalito para ti, sofi</p>
      <p class="gate-question" id="gateQuestion">¿quieres abrirlo?</p>
      <div class="gate-buttons">
        <button class="btn-gate btn-yes" id="btnYes">sí 💛</button>
        <button class="btn-gate btn-no" id="btnNo">no</button>
      </div>
    </div>
  </div>

  <div class="scene" id="giftScene">
    <div class="bouquet-wrapper" id="bouquetWrapper">
      <div class="ground-shadow"></div>

      <div class="paper-wrap">
        <div class="paper-layer layer-1"></div>
        <div class="paper-layer layer-2"></div>
        <div class="paper-layer layer-3"></div>
        <div class="paper-layer layer-4"></div>
      </div>

      <div class="dome" id="dome"></div>

      <div class="ribbon">
        <div class="ribbon-tail left"></div>
        <div class="ribbon-tail right"></div>
        <div class="ribbon-wing left"></div>
        <div class="ribbon-wing right"></div>
        <div class="ribbon-badge"></div>
      </div>
    </div>

    <div class="card">
      <p class="dedication">feliz día, mi vida, eres el mejor regalo que la vida me pudo haber dado, te amo mucho sofiii🫀✨</p>
    </div>
  </div>

<script>
  // ---------- ESTRELLAS ----------
  (function generarEstrellas(){
    const contenedor = document.getElementById('stars');
    const total = 140;
    const frag = document.createDocumentFragment();
    for(let i=0;i<total;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = (Math.random()*2 + 0.6).toFixed(2);
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.top = (Math.random()*100) + 'vh';
      s.style.left = (Math.random()*100) + 'vw';
      const dur = (Math.random()*3 + 2).toFixed(2);
      const delay = (Math.random()*4).toFixed(2);
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = delay + 's';
      frag.appendChild(s);
    }
    contenedor.appendChild(frag);
  })();

  // ---------- INTERACCIÓN DEL REGALO (SÍ / NO) ----------
  (function gateRegalo(){
    const gate = document.getElementById('gate');
    const scene = document.getElementById('giftScene');
    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const question = document.getElementById('gateQuestion');
    const giftBox = document.getElementById('giftBox');

    const frasesNo = [
      "¿segura? 🥺",
      "vamos, di que sí 💛",
      "no puedes decir que no jsjs",
      "inténtalo de nuevo",
      "el regalo se pone triste si dices que no 🥹"
    ];
    let intentos = 0;
    let noScale = 1;

    function moverBotonNo(){
      const wrap = btnNo.parentElement.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();
      const maxX = Math.max(wrap.width - btnRect.width, 20);
      const maxY = 90;
      const x = (Math.random() - 0.5) * maxX;
      const y = (Math.random() - 0.5) * maxY;
      btnNo.style.transform = `translate(${x}px, ${y}px) scale(${noScale})`;
    }

    btnNo.addEventListener('pointerenter', ()=>{
      intentos++;
      noScale = Math.max(0.55, 1 - intentos*0.07);
      question.textContent = frasesNo[Math.min(intentos-1, frasesNo.length-1)];
      moverBotonNo();
    });

    btnNo.addEventListener('click', (e)=>{
      e.preventDefault();
      intentos++;
      noScale = Math.max(0.55, 1 - intentos*0.07);
      question.textContent = frasesNo[Math.min(intentos-1, frasesNo.length-1)];
      moverBotonNo();
    });

    btnYes.addEventListener('click', ()=>{
      giftBox.textContent = "💛";
      gate.classList.add('gate-hide');
      setTimeout(()=>{
        gate.style.display = 'none';
        scene.classList.add('scene-visible');
      }, 650);
    });
  })();

  // ---------- CÚPULA DE FLORES (distribución tipo Fibonacci-hemisferio) ----------
  (function generarFlores(){
    const dome = document.getElementById('dome');
    const domeW = 400;
    const domeH = 185;
    const cx = domeW/2;
    const cy = domeH - 8;   // base de la cúpula
    const total = 195;
    const goldenAngle = Math.PI * (3 - Math.sqrt(5)); // ~137.5°

    const flores = [];

    for(let i=0;i<total;i++){
      // distribución uniforme en un hemisferio (Fibonacci)
      const t = i / total;
      const theta = Math.acos(1 - t);       // 0 (arriba) -> PI/2 (ecuador)
      const phi = i * goldenAngle;

      const x = Math.sin(theta) * Math.cos(phi);
      const z = Math.sin(theta) * Math.sin(phi); // profundidad
      const y = Math.cos(theta);                 // 1 arriba -> 0 ecuador

      // proyección a elipse 2D (más ancha que alta = efecto de vista superior)
      const px = cx + x * (domeW/2 - 6);
      const py = cy - y * (domeH - 20) + (z * 10); // leve efecto de profundidad/ladeo en Y

      // tamaño y brillo según profundidad (z) y altura (y)
      const depthFactor = (z + 1) / 2;           // 0..1
      const size = 20 + depthFactor * 15 + Math.random()*5;
      const brightness = 0.72 + depthFactor * 0.42 + (y*0.12);
      const zIndex = Math.round((z+1)*100);

      flores.push({px, py, size, brightness, zIndex});
    }

    const frag = document.createDocumentFragment();

    flores.forEach(f=>{
      const el = document.createElement('div');
      el.className = 'flower';
      el.style.width = f.size + 'px';
      el.style.height = f.size + 'px';
      el.style.left = (f.px - f.size/2) + 'px';
      el.style.top = (f.py - f.size/2) + 'px';
      el.style.zIndex = f.zIndex;
      el.style.filter = `brightness(${f.brightness.toFixed(2)}) drop-shadow(${(2+Math.random()*2).toFixed(1)}px ${(3+Math.random()*3).toFixed(1)}px ${(3+Math.random()*2).toFixed(1)}px rgba(20,10,0,0.35))`;

      const baseRot = Math.floor(Math.random()*360);
      const tipColor  = '#FFFF00';
      const midColor  = Math.random() < 0.5 ? '#FFFF00' : '#FFE000';
      const baseColor = '#FFE000';

      // ---- capa exterior de pétalos (más largos) ----
      const outerCount = 9 + (Math.random()<0.5?1:0);
      const outerLen = f.size*0.58;
      const outerW = f.size*0.30;
      for(let j=0;j<outerCount;j++){
        const angle = (360/outerCount)*j + baseRot + (Math.random()*6-3);
        const p = document.createElement('div');
        p.className = 'petal outer';
        p.style.width = outerW + 'px';
        p.style.height = outerLen + 'px';
        p.style.marginLeft = -(outerW/2) + 'px';
        p.style.marginTop = -outerLen + 'px';
        p.style.transform = `rotate(${angle}deg)`;
        p.style.background = `linear-gradient(180deg, ${tipColor} 0%, ${midColor} 48%, ${baseColor} 100%)`;
        p.style.boxShadow = `inset 0 -${(outerLen*0.18).toFixed(1)}px ${(outerLen*0.22).toFixed(1)}px rgba(120,60,0,0.28), inset 0 ${(outerLen*0.12).toFixed(1)}px ${(outerLen*0.18).toFixed(1)}px rgba(255,255,255,0.45)`;
        el.appendChild(p);
      }

      // ---- capa interior de pétalos (más cortos, más brillantes, offset) ----
      const innerCount = 7;
      const innerLen = f.size*0.40;
      const innerW = f.size*0.24;
      for(let j=0;j<innerCount;j++){
        const angle = (360/innerCount)*j + baseRot + (360/innerCount)/2 + (Math.random()*5-2.5);
        const p = document.createElement('div');
        p.className = 'petal inner';
        p.style.width = innerW + 'px';
        p.style.height = innerLen + 'px';
        p.style.marginLeft = -(innerW/2) + 'px';
        p.style.marginTop = -innerLen + 'px';
        p.style.transform = `rotate(${angle}deg)`;
        p.style.background = `linear-gradient(180deg, #FFFF00 0%, ${tipColor} 35%, ${midColor} 100%)`;
        p.style.boxShadow = `inset 0 ${(innerLen*0.14).toFixed(1)}px ${(innerLen*0.16).toFixed(1)}px rgba(255,255,255,0.5)`;
        el.appendChild(p);
      }

      // ---- disco central texturizado ----
      const discSize = f.size*0.36;
      const disc = document.createElement('div');
      disc.className = 'disc';
      disc.style.width = discSize + 'px';
      disc.style.height = discSize + 'px';
      disc.style.background = `
        repeating-conic-gradient(from ${baseRot}deg, #170c05 0deg 5deg, #2f1c0b 5deg 10deg),
        radial-gradient(circle at 38% 32%, #5a3717 0%, #24140a 55%, #0d0603 100%)
      `;
      disc.style.backgroundBlendMode = 'multiply';
      disc.style.boxShadow = `inset 0 0 ${(discSize*0.18).toFixed(1)}px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,224,160,0.18)`;
      el.appendChild(disc);

      frag.appendChild(el);
    });

    dome.appendChild(frag);
  })();
</script>

</body>
